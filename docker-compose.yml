services:
  stt:
    build:
      context: .
      dockerfile: services/stt/Dockerfile
    container_name: ai-stt
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - OMP_NUM_THREADS=4
      - PYTHONUNBUFFERED=1
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 300s
      retries: 12
    restart: unless-stopped

  llm:
    build:
      context: .
      dockerfile: services/llm/Dockerfile
    container_name: ai-llm
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      # Backward-compatible fallback for existing local .env files. New setups
      # should use LLM_API_KEY instead.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - PYTHONUNBUFFERED=1
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 45s
      retries: 12
    restart: unless-stopped

  tts:
    build:
      context: .
      dockerfile: services/tts/Dockerfile
    container_name: ai-tts
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_VOICE=${ELEVENLABS_VOICE:-}
      - ELEVENLABS_VOICE_NAME=${ELEVENLABS_VOICE_NAME:-}
      - ELEVENLABS_EN_VOICE_ID=${ELEVENLABS_EN_VOICE_ID:-}
      - ELEVENLABS_EN_VOICE=${ELEVENLABS_EN_VOICE:-}
      - ELEVENLABS_EN_VOICE_NAME=${ELEVENLABS_EN_VOICE_NAME:-}
      - ELEVENLABS_AR_VOICE_ID=${ELEVENLABS_AR_VOICE_ID:-}
      - ELEVENLABS_AR_VOICE=${ELEVENLABS_AR_VOICE:-}
      - ELEVENLABS_AR_VOICE_NAME=${ELEVENLABS_AR_VOICE_NAME:-}
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 45s
      retries: 12
    restart: unless-stopped

networks:
  ai-network:
    driver: bridge
