version: "3.9"

services:
  stt:
    build:
      context: ./services/stt
      dockerfile: Dockerfile
    container_name: ai-stt
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - OMP_NUM_THREADS=4
      - PYTHONUNBUFFERED=1
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  llm:
    build:
      context: ./services/llm
      dockerfile: Dockerfile
    container_name: ai-llm
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - PYTHONUNBUFFERED=1
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  tts:
    build:
      context: ./services/tts
      dockerfile: Dockerfile
    container_name: ai-tts
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - ELEVENLABS_VOICE=${ELEVENLABS_VOICE:-}
      - ELEVENLABS_VOICE_NAME=${ELEVENLABS_VOICE_NAME:-}
      - ELEVENLABS_EN_VOICE_ID=${ELEVENLABS_EN_VOICE_ID:-}
      - ELEVENLABS_EN_VOICE=${ELEVENLABS_EN_VOICE:-}
      - ELEVENLABS_EN_VOICE_NAME=${ELEVENLABS_EN_VOICE_NAME:-}
      - ELEVENLABS_AR_VOICE_ID=${ELEVENLABS_AR_VOICE_ID:-}
      - ELEVENLABS_AR_VOICE=${ELEVENLABS_AR_VOICE:-}
      - ELEVENLABS_AR_VOICE_NAME=${ELEVENLABS_AR_VOICE_NAME:-}
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

networks:
  ai-network:
    driver: bridge
